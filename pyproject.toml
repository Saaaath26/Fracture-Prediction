[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "fracatlas-research"
version = "0.1.1"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "Pillow>=10", "PyYAML>=6"]
[project.optional-dependencies]
yolo = ["ultralytics>=8.4", "torch>=2.2"]
analysis = ["scikit-learn>=1.3", "xgboost>=2", "joblib>=1.3"]
neural = ["torch>=2.2"]
nnunet = ["nnunetv2>=2.5"]
dashboard = ["streamlit>=1.35"]
test = ["pytest>=8", "ruff>=0.6", "scikit-learn>=1.3"]
[project.scripts]
fracatlas = "fracatlas.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
